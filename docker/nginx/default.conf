upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Must be >= MAX_UPLOAD_SIZE_MB (20 MB) plus a little overhead.
    client_max_body_size 25M;

    # Serve collected static + uploaded media directly from nginx.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Uploaded documents are tenant data. This location is `internal`, so nginx
    # refuses it on a direct request and serves it ONLY when Django answers with
    # X-Accel-Redirect -- which it does after checking the caller owns the file.
    # Django checks permission; nginx still moves the bytes, so a large download
    # never occupies a gunicorn worker.
    location /protected-media/ {
        internal;
        alias /app/media/;
    }

    # The old public location. Kept as an explicit 404 rather than deleted, so a
    # stale link fails closed instead of falling through to the Django proxy.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}

